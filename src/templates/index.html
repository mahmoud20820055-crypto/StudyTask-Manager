<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyTask Manager</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="container">
    <header>
      <h1>StudyTask Manager</h1>
      <p class="subtitle">Keep track of your assignments, labs and exams.</p>
    </header>

    <section class="stats">
      <div class="stat"><span id="stat-total">0</span><label>Total</label></div>
      <div class="stat"><span id="stat-pending">0</span><label>Pending</label></div>
      <div class="stat"><span id="stat-done">0</span><label>Done</label></div>
    </section>

    <form id="task-form" class="card">
      <input id="title" type="text" placeholder="Task title (e.g. OS Lab report)" maxlength="120" required>
      <input id="course" type="text" placeholder="Course" maxlength="60">
      <select id="priority">
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
      </select>
      <input id="due_date" type="date">
      <button type="submit">Add task</button>
    </form>
    <p id="error" class="error" hidden></p>

    <ul id="task-list" class="task-list"></ul>
    <p id="empty" class="empty" hidden>No tasks yet. Add your first one above.</p>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
